<title>Birds heard today</title>
<style>
  :root {

  .stage { position: relative; margin: 0 calc(var(--u) * 1.8); overflow: hidden;

  .banner { position: fixed; left: 50%; top: calc(var(--u) * .9); z-index: 30;

  .empty p { margin: 0; }
  .empty .big { font-size: calc(var(--u) * 1.9); font-weight: 500; }

  .modal.open { display: grid; }
  .card { position: relative; background: var(--card); border: 1px solid var(--card-edge);
    border-radius: 6px; width: min(94vw, 900px); max-height: 94vh; overflow: auto;
    padding: calc(var(--u) * 1.5); display: grid; gap: calc(var(--u) * 1.4);
    grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: center; }

  .art { text-align: center; }
  .mstage { position: relative; display: inline-block; max-width: 100%; }
  .mstage img.main { display: block; max-width: 100%; max-height: 66vh; width: auto; height: auto; }
  .mstage .layer { position: absolute; height: auto; }
  .mstage.plate::after { content: ""; position: absolute; inset: 0; pointer-events: none;

    padding: max(6vmin, env(safe-area-inset-top)) max(7vmin, env(safe-area-inset-right))
      max(8vmin, env(safe-area-inset-bottom)) max(5vmin, env(safe-area-inset-left)); }
  .hero.in { opacity: 1; }
  .h-art { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; }
  .h-stage { position: relative; display: inline-block; max-width: 100%; }
  .h-stage img.main { display: block; width: auto; height: auto; max-width: 100%;

  .h-stage .layer { position: absolute; height: auto; }
  .h-stage.plate::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 22px 18px var(--plate); }
  .h-stage .layer.flick-now { animation: tail-once .7s ease; }
  .h-stage .layer.twitch-now { animation: head-once .6s ease; }
  .h-stage .phart { width: calc(min(46vw, 60vh) * var(--hs, 1)); height: auto; aspect-ratio: 560 / 440; }
  .h-stamp { position: absolute; left: max(4.5vmin, env(safe-area-inset-left));

<body>
<header class="masthead">
  <div><h1>Heard today</h1><p class="where" id="where"></p></div>
  <div class="when"><p id="date"></p><p class="count" id="count"></p></div>
</header>
<main class="stage" id="stage" aria-label="Birds heard today"></main>
<footer class="foot">
  <p class="also" id="also"></p>
  <div class="dots" id="dots"></div>
  <p class="upd" id="upd"></p>
</footer>
<div class="modal" id="modal">
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <button class="close" id="close" type="button" aria-label="Close">&times;</button>
    <div class="art"><div class="mstage" id="mstage"></div></div>
    <div class="info">
      <h2 id="m-name"></h2>
      <p class="sci" id="m-sci"></p>
      <p class="n" id="m-n"></p>
      <p class="rng" id="m-rng"></p>
      <p class="note" id="m-note"></p>
      <div class="strip" id="m-strip"></div>
      <div class="strip-l" id="m-lab"></div>
      <p class="strip-t">Each mark is one time it was heard.</p>
    </div>
  </div>
</div>
<div class="hero" id="hero" role="dialog" aria-modal="true" aria-labelledby="h-name">
  <button class="h-close" id="h-close" type="button" aria-label="Close">&times;</button>
  <p class="h-stamp" id="h-stamp"></p>
  <div class="h-art"><div class="h-stage" id="h-stage"></div></div>
  <div class="h-text">
    <h2 id="h-name"></h2>
    <p class="h-sci" id="h-sci"></p>
    <p class="h-fact" id="h-fact"></p>
    <p class="h-meta" id="h-meta"></p>
  </div>
  <p class="h-hint" id="h-hint">Tap to close</p>
  <i class="h-time" id="h-time"></i>
</div>
<div class="banner" id="banner" role="status" aria-live="polite"></div>
<div class="dim"></div>

        if (++liveFails >= 3) { liveOff = Date.now() + 600000; liveFails = 0; }
      });
  }
  if (window.fetch) {
    setInterval(poll, 8000);
    setTimeout(poll, 1500);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { poll(); } });
  }
  /* Without live updates, reload every few minutes while nobody is touching it;
     with them, only now and then so the page itself stays fresh. */
  setInterval(function () {
    var limit = liveOK ? 3600000 : 300000;
    if (!modal.classList.contains('open') && !heroOn() && Date.now() - lastTouch > 90000 &&
        Date.now() - loadedAt > limit) { location.reload(); }
  }, 60000);
})();
</script>
</body>
