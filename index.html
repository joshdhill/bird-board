<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Birds heard today</title>
<style>
  :root {
    --u: clamp(11px, 2.05vmin, 17px);
    --paper: #faf8f2;
    --paper-edge: #ece8dc;
    --ink: #232b31;
    --ink-soft: #666c70;
    --rule: #bdb9ac;
    --mark: #3d6a8a;
    --card: #f5eedc;
    --card-edge: #d8cdb0;
  }
  /* TV look (add ?tv to the address): a deeper paper and darker ink so a TV,
     which brightens everything, does not wash the whites out. ?tv=0 turns it off. */
  html.tv {
    --paper: #e8dec4; --paper-edge: #d7c9a8; --ink: #15120d; --ink-soft: #3b3528;
    --rule: #8a7f66; --mark: #24506f; --card: #efe5cb; --card-edge: #b4a47c;
  }
  html.tv body { background: var(--paper); }
  html.tv body::before { display: none; }
  html.tv .cap, html.tv .where, html.tv .count, html.tv .upd, html.tv .hint { font-weight: 600; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Gill Sans", "Gill Sans MT", Optima, Candara, "Segoe UI",
      system-ui, sans-serif;
    font-size: var(--u); line-height: 1.3; color: var(--ink);
    background: radial-gradient(ellipse 85% 80% at 50% 46%,
      var(--paper) 58%, var(--paper-edge) 100%);
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    height: 100vh; height: 100dvh; height: var(--appH, 100dvh); overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color: transparent; user-select: none;
    -webkit-user-select: none;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    opacity: .5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .masthead {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin: 0 calc(var(--u) * 1.8); padding: calc(var(--u) * 1.1) 0 calc(var(--u) * .65);
    border-bottom: 1px solid var(--rule); position: relative;
  }
  h1 { margin: 0; font-size: calc(var(--u) * 2.05); font-weight: 500;
    letter-spacing: .01em; line-height: 1.05; }
  .masthead p { margin: 0; }
  .where { margin-top: calc(var(--u) * .3) !important; font-size: .92em;
    color: var(--ink-soft); }
  .when { text-align: right; }
  .when .count { color: var(--ink-soft); font-size: .92em; margin-top: calc(var(--u) * .2); }
  .stage { position: relative; margin: 0 calc(var(--u) * 1.8); overflow: visible;
    touch-action: pan-y; }
  .page { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    transition: opacity .7s ease; }
  .page.on { opacity: 1; pointer-events: auto; }
  .bird { position: absolute; display: flex; flex-direction: column;
    align-items: center; background: none; border: 0; padding: 0; margin: 0;
    font: inherit; color: inherit; cursor: pointer; text-align: center;
    touch-action: manipulation; border-radius: 4px; }
  .bird img { display: block; height: auto; pointer-events: none; }
  .bird:focus-visible, .dot:focus-visible, .close:focus-visible {
    outline: 2px solid var(--mark); outline-offset: 3px; }
  .bird:active img { transform: translateY(1px); }
  .cap { margin-top: calc(var(--u) * .2); line-height: 1.18; }
  .cap::before { content: ""; display: block; width: 1px; height: calc(var(--u) * .65);
    background: var(--rule); margin: 0 auto calc(var(--u) * .3); }
  .cap { white-space: nowrap; }
  .cap b { display: block; font-weight: 600; }
  .cap span { display: block; font-size: .88em; color: var(--ink-soft); }
  .caps1 .cap { font-size: .86em; }
  .caps1 .cap span { display: none; }
  .caps0 .cap { display: none; }
  .caps0 .bird { border-radius: 8px; }

  @keyframes settle { from { opacity: 0; transform: translateY(calc(var(--u) * .7)); }

  /* Now and then a little puff of notes rises from the beak (see chirpTick) */

  .bird.chirp .notes { display: block; }
  .notes.two i:nth-child(3) { display: none; }
  .notes i { position: absolute; left: .05em; top: -.8em; font-style: normal; font-weight: 700; line-height: 1;
    color: var(--mark); filter: saturate(1.4) brightness(.8);
    text-shadow: 0 0 2px var(--paper), 0 0 5px var(--paper), 0 0 9px var(--paper);
    opacity: 0; --dx: 1; }
  .notes.left i { left: -.75em; --dx: -1; }
  .notes.flat i { top: -.45em; }
  @media (prefers-reduced-motion: no-preference) {
    .bird.chirp .notes i { animation: sing 2.4s ease-out both; }
    .bird.chirp .notes i:nth-child(2) { animation-delay: .55s; font-size: .82em; }
    .bird.chirp .notes i:nth-child(3) { animation-delay: 1.15s; font-size: .9em; }

  @media (prefers-reduced-motion: reduce) { .bird.chirp .notes i:first-child { opacity: .85; } }

    60% { opacity: .9; transform: translate(calc(var(--dx) * 1.1em), -.25em) scale(1) rotate(calc(var(--dx) * 10deg)); }
    100% { opacity: 0; transform: translate(calc(var(--dx) * 2em), -.5em) scale(1.05) rotate(calc(var(--dx) * -6deg)); }
  }
  @keyframes sing {
    0% { opacity: 0; transform: translate(0, .2em) scale(.55) rotate(0deg); }

    60% { opacity: .9; transform: translate(calc(var(--dx) * .8em), -.9em) scale(1) rotate(calc(var(--dx) * 10deg)); }
    100% { opacity: 0; transform: translate(calc(var(--dx) * 1.3em), -1.6em) scale(1.05) rotate(calc(var(--dx) * -6deg)); }
  }
  /* Blank card for a bird with no picture yet */
  .phart { display: block; }
  .phart svg { display: block; width: 100%; height: 100%; }
  .bird.ph .cap b { color: var(--mark); }
  .caps0 .bird.ph .cap { display: block; font-size: .86em; }
  .caps0 .bird.ph .cap span { display: none; }
  /* A bird that was just heard: drops in, rings, glows, and a banner announces it */
  .stage.swap { animation: swapin .6s ease both; }
  @keyframes swapin { from { opacity: .15; } to { opacity: 1; } }
  .bird.arrive { z-index: 3; animation: arrive 1.5s cubic-bezier(.2, .85, .25, 1.1) both; }
  .bird.arrive::before { content: ""; position: absolute; inset: -10px; border-radius: 16px;
    border: 2px solid var(--mark); opacity: 0; pointer-events: none;
    animation: ring 2s ease-out .5s 3; }
  .bird.arrive img, .bird.arrive .phart { animation: glow 6s ease-out both; }
  @keyframes arrive { 0% { opacity: 0; transform: translateY(calc(var(--u) * -4)) scale(.3); }
    55% { opacity: 1; transform: scale(1.14); } 100% { opacity: 1; transform: none; } }
  @keyframes ring { 0% { opacity: .85; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.35); } }
  @keyframes glow { 0%, 35% { filter: drop-shadow(0 0 calc(var(--u) * 1.1) rgba(61, 106, 138, .75)); }
    100% { filter: none; } }
  .banner { position: fixed; left: 50%; top: calc(var(--u) * .9); z-index: 30;
    transform: translate(-50%, -190%); opacity: 0; pointer-events: none;
    background: var(--mark); color: #fff; font-weight: 600; letter-spacing: .01em;
    padding: calc(var(--u) * .6) calc(var(--u) * 1.4); border-radius: 999px;
    box-shadow: 0 6px 22px rgba(35, 43, 49, .3); white-space: nowrap;
    max-width: 94vw; overflow: hidden; text-overflow: ellipsis;
    transition: transform .65s cubic-bezier(.2, .9, .25, 1.15), opacity .4s; }
  .banner.on { transform: translate(-50%, 0); opacity: 1; }
  .info .note { margin: calc(var(--u) * .7) 0 0; color: var(--mark); }
  .info .note:empty { display: none; }
  .m-call { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-top: calc(var(--u) * .7); }
  .m-call[hidden] { display: none; }
  .m-play { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: .95em; color: #faf8f2;

  .foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;

    font-size: .86em; color: var(--ink-soft); height: 44px; }

  .upd { text-align: right; white-space: nowrap; }
  .dots { display: flex; gap: 2px; }

  /* Music: the note button and Spotify's player panel */

  .mbtn { position: relative; flex: none; width: 32px; height: 32px; padding: 0; display: grid;
    place-items: center; border: 1px solid var(--rule); border-radius: 50%; background: none;
    color: var(--ink-soft); cursor: pointer; opacity: .7; touch-action: manipulation;
    transition: opacity .2s, color .2s, border-color .2s; }
  .mbtn svg { display: block; width: 18px; height: 18px; }
  .mbtn:hover, .mbtn[aria-expanded="true"], body.music-on #mbtn { opacity: 1; color: var(--mark); border-color: var(--mark); }
  body.music-on #mbtn::after { content: ""; position: absolute; top: -2px; right: -2px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 2px var(--paper); }
  .mbtn:focus-visible, .m-x:focus-visible, .chip button:focus-visible, .m-add button:focus-visible,
  .m-add input:focus-visible, .m-stop:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  html.nomusic #mbtn, html.nomusic .music { display: none !important; }
  .vbtn .v-off, .vbtn.off .v-on { display: none; }
  .vbtn.off .v-off { display: inline; }
  .vbtn:not(.off) { opacity: 1; color: var(--mark); border-color: var(--mark); }
  .vbtn.wait::after { content: ""; position: absolute; top: -2px; right: -2px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 2px var(--paper); }
  @media (prefers-reduced-motion: no-preference) { .vbtn.wait::after { animation: v-wait 2.4s ease-in-out infinite; } }
  @keyframes v-wait { 50% { opacity: .25; } }
  .vbtn:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  /* Today / This hour */
  .view { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--rule); border-radius: 999px;
    justify-self: start; }
  .view button { font: inherit; font-size: .95em; color: var(--ink-soft); background: none; border: 0;
    border-radius: 999px; padding: 5px 12px; cursor: pointer; touch-action: manipulation; white-space: nowrap; }
  .view button[aria-pressed="true"] { background: var(--mark); color: #faf8f2; }
  .view button:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  /* Listening: is BirdNET using the backyard mic? */
  .lbtn { display: inline-flex; align-items: center; gap: 7px; flex: none; font: inherit; color: var(--ink-soft);
    background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 5px 11px 5px 9px;
    cursor: pointer; touch-action: manipulation; white-space: nowrap; }
  .lbtn[hidden] { display: none; }
  .lbtn i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ink-soft); flex: none; }
  .lbtn.on { color: var(--mark); border-color: var(--mark); }
  .lbtn.on i { background: var(--mark); border-color: var(--mark); }
  .lbtn.nv { color: #faf8f2; background: var(--mark); border-color: var(--mark); padding: 5px 12px; }
  .lbtn.starting i, .lbtn.stopping i { border-color: var(--mark); border-right-color: transparent; }
  @media (prefers-reduced-motion: no-preference) {

  @keyframes l-live { 0%, 100% { box-shadow: 0 0 0 0 rgba(61, 106, 138, .45); } 50% { box-shadow: 0 0 0 5px rgba(61, 106, 138, 0); } }
  @keyframes l-spin { to { transform: rotate(360deg); } }
  .lbtn:focus-visible, .l-go:focus-visible, .l-x:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  .lpanel { position: fixed; right: calc(var(--u) * 1.8); bottom: calc(52px + env(safe-area-inset-bottom)); z-index: 16;
    width: min(340px, calc(100vw - var(--u) * 3.6)); background: var(--card); border: 1px solid var(--card-edge);
    border-radius: 6px; padding: 12px 14px 14px; box-shadow: 0 12px 34px rgba(35, 43, 49, .3); color: var(--ink);
    visibility: hidden; opacity: 0; transform: translateY(10px);

  .lpanel h3 span { flex: 1; }
  .lpanel p { margin: 0; color: var(--ink-soft); line-height: 1.4; }
  .l-x { width: 32px; height: 32px; margin: -6px -8px -6px 0; padding: 0; background: none; border: 0;

  .l-go { margin-top: 12px; font: inherit; font-size: 1em; padding: 9px 16px; border-radius: 999px; cursor: pointer;

    .upd, .hint { display: none; }

  }
  .music { position: fixed; right: calc(var(--u) * 1.8); bottom: calc(52px + env(safe-area-inset-bottom)); z-index: 15;

    var banner = $('banner'), names = list.map(function (b) { return b.name; });
    var blank = list.some(function (b) { return b.ph; });
    banner.textContent = (names.length === 1 ? 'New bird: ' : 'New birds: ') + names.join(', ') +
      (blank ? ' \u2013 no picture yet' : '');
    banner.classList.add('on');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function () { banner.classList.remove('on'); }, 11000);
  }
  /* ---- The full-screen card for a new bird ----
     A bird heard for the first time today fills the screen with its picture, its
     name and a fun fact, then steps aside and lands on the board. Short: with
     sound on, the voice reads the fact, the bird calls (up to 12 s), a short
     pause, and the card goes. With sound off it stays about as long as the fact
     takes to read (12-24 s). A first-ever bird gets the filled stamp. Several at
     once take turns. Tap, click or Esc closes it (and skips the rest of the
     queue). ?newbird=off goes back to the small banner on one screen;
     ?newbird=on turns the card back on. */
  var HERO_BEAT_MS = 2500, HERO_MIN_MS = 9000, heroTalking = false;
  var hero = $('hero'), hstage = $('h-stage'), heroQ = [], heroNow = null, heroTimer = null,
      heroOut = null, hintTimer = null, hTail = null, hHead = null,
      heroStart = 0, heroEnd = 0, heroPlan = 0, heroOff = false;
  try {
    var nbq = /[?&]newbird=(on|off)/.exec(location.search);
    if (nbq) { if (nbq[1] === 'off') { localStorage.setItem('bb-hero', '0'); } else { localStorage.removeItem('bb-hero'); } }
    heroOff = localStorage.getItem('bb-hero') === '0';
  } catch (e) { /* storage blocked: the card stays on */ }
  function heroOn() { return hero.classList.contains('on'); }
  function heroWords(b) { return ((b.name || '') + ' ' + (b.fact || '')).split(/\s+/).length; }
  /* No sound on this screen: about as long as the card takes to read. */
  function heroRead(b) {
    var ms = Math.max(12000, Math.min(24000, 5000 + heroWords(b) * 300));
    if (heroQ.length) { ms = Math.max(HERO_MIN_MS, ms * 0.7); }
    return ms + (b.life ? 3000 : 0);
  }
  /* Sound on: a guess at fact + call, only for the time bar (and as a safety
     net); the card really ends when the call has finished. */
  function heroTalk(b) { return VOICE_DELAY_MS + 2500 + heroWords(b) * 420 + (b.snd ? CALL_MAX_MS : 0) + HERO_BEAT_MS; }
  function fillHero(b) {
    clearInterval(hTail); clearInterval(hHead); hstage.innerHTML = '';
    hero.style.background = b.anim ? b.anim.bg : '';
    hstage.classList.toggle('plate', !!b.anim);
    hstage.style.setProperty('--plate', b.anim ? b.anim.bg : 'transparent');
    if (b.anim) {
      var base = new Image(); base.className = 'main'; base.alt = b.name; base.src = b.anim.base; hstage.appendChild(base);
      var t = layerImg(b.anim.tail, b.anim.tailGeom, 'tail'), h = layerImg(b.anim.head, b.anim.headGeom, 'head');
      hstage.appendChild(t); hstage.appendChild(h);
      if (!reduce) {
        setTimeout(function () { once(t, 'flick-now'); }, 1800);
        setTimeout(function () { once(h, 'twitch-now'); }, 2700);
        hTail = setInterval(function () { once(t, 'flick-now'); }, 3500);
        hHead = setInterval(function () { once(h, 'twitch-now'); }, 4500);
      }
    } else if (b.ph) { hstage.appendChild(phArt()); }
    else { var m = new Image(); m.className = 'main'; m.alt = b.name; m.onload = fitHero; m.src = absImg(b.img); fade(m, b); hstage.appendChild(m); }
    hero.classList.toggle('life', !!b.life);
    $('h-stamp').textContent = b.life ? 'New bird alert' : 'New today';
    $('h-name').textContent = b.name;
    $('h-sci').textContent = (b.sci && b.sci !== b.name) ? b.sci : '';
    $('h-fact').textContent = b.fact || '';
    $('h-meta').textContent = (b.life ? 'First time heard here, at ' : 'Heard at ') + b.first + '.' +
      (b.ph ? ' There is no picture for this bird yet.' : '') +
      (b.sndby ? ' Call: ' + b.sndby + '.' : '');
  }
  /* Whatever the screen shape, the picture and the words must both fit: shrink them
     together, a little at a time, until nothing runs past the top or bottom. */
  function fitHero() {
    if (!heroOn()) { return; }
    var hs = 1, vh = window.innerHeight, m = vh * 0.025, art = hero.querySelector('.h-art'), txt = hero.querySelector('.h-text');
    hero.style.setProperty('--hs', '1');
    for (var i = 0; i < 10; i++) {
      var top = Math.min(art.offsetTop, txt.offsetTop);
      var bot = Math.max(art.offsetTop + art.offsetHeight, txt.offsetTop + txt.offsetHeight);
      if (top >= m && bot <= vh - m) { break; }
      hs -= 0.07; hero.style.setProperty('--hs', hs.toFixed(2));
    }
  }
  window.addEventListener('resize', function () { if (heroOn()) { fitHero(); } });
  function setHeroEnd(t, fresh) {
    var now = Date.now(), bar = $('h-time');
    var cur = fresh ? 1 : Math.max(0, Math.min(1, (heroEnd - now) / Math.max(1, heroEnd - heroPlan)));
    heroEnd = t; heroPlan = now;
    bar.style.transition = 'none'; bar.style.transform = 'scaleX(' + cur + ')';
    void bar.offsetWidth;
    bar.style.transition = 'transform ' + Math.max(0, t - now) + 'ms linear';
    bar.style.transform = 'scaleX(0)';
    clearTimeout(heroTimer);
    heroTimer = setTimeout(function () { closeHero(false); }, Math.max(0, t - now));
  }
  function showHero(b) {
    stopModalCall();
    heroNow = b; fillHero(b);
    clearTimeout(heroOut);
    hero.classList.add('on');
    void hero.offsetWidth;
    fitHero();
    hero.classList.add('in');
    heroStart = Date.now();
    var talking = heroTalking = sayBird(b, function () {
      if (heroNow !== b) { return; }
      heroTalking = false;
      setHeroEnd(Math.max(Date.now() + (heroQ.length ? 1200 : HERO_BEAT_MS), heroStart + HERO_MIN_MS), false);
    });
    setHeroEnd(heroStart + (talking ? heroTalk(b) + 8000 : heroRead(b)), true);
    $('h-hint').classList.remove('quiet');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { $('h-hint').classList.add('quiet'); }, 9000);
  }
  function nextHero() { var b = heroQ.shift(); if (b) { showHero(b); } }
  /* After the card: put the bird back on the board where it belongs. */
  function pulse(names) {
    var first = true;
    names.forEach(function (n) {
      var els = stage.querySelectorAll('.bird');
      for (var i = 0; i < els.length; i++) {
        if (els[i].getAttribute('data-name') !== n) { continue; }
        if (first) {
          for (var k = 0; k < pages.length; k++) { if (pages[k].contains(els[i])) { show(k); break; } }
          restartAuto(); first = false;
        }
        els[i].classList.remove('arrive'); void els[i].offsetWidth; els[i].classList.add('arrive');
        (function (el) { setTimeout(function () { el.classList.remove('arrive'); }, 9000); })(els[i]);
      }
    });
  }
  function closeHero(user) {
    var skipped = [];
    if (user) { hush(); }
    if (user) { skipped = heroQ.map(function (q) { return q.name; }); heroQ.length = 0; }
    if (!heroNow) { return; }
    var gone = [heroNow.name].concat(skipped);
    heroNow = null;
    clearTimeout(heroTimer); clearTimeout(hintTimer);
    hero.classList.remove('in');
    clearTimeout(heroOut);
    heroOut = setTimeout(function () {
      if (heroQ.length) { nextHero(); return; }
      hero.classList.remove('on'); hstage.innerHTML = ''; hero.style.background = '';
      clearInterval(hTail); clearInterval(hHead);
      pulse(gone);
    }, reduce ? 60 : 650);
  }
  function enqueueHero(list) {
    list.forEach(function (b) {
      if (b.life) {
        var i = 0; while (i < heroQ.length && heroQ[i].life) { i++; }
        heroQ.splice(i, 0, b);
      } else { heroQ.push(b); }
    });
    if (!heroOn()) { nextHero(); return; }
    if (heroNow && !heroTalking) {   /* a silent card is up: the next one follows soon */
      var cap = Math.max(heroStart + HERO_MIN_MS, Date.now() + 4000);
      if (heroEnd > cap) { setHeroEnd(cap, false); }
    }
  }
  hero.addEventListener('click', function () { closeHero(true); });
  /* ?demo shows the card for the newest bird on the board (?demo=jay picks by name;
     add &life for the first-ever look) so you can see it without waiting for a bird. */
  var dq = /[?&]demo(?:=([^&#]*))?/.exec(location.search);
  if (dq && D.birds.length) {
    setTimeout(function () {
      var want = decodeURIComponent((dq[1] || '').replace(/\+/g, ' ')).toLowerCase(), pick = D.birds[D.birds.length - 1];
      if (want) { D.birds.forEach(function (b) { if (b.name.toLowerCase().indexOf(want) >= 0) { pick = b; } }); }
      var demo = {}; for (var k in pick) { demo[k] = pick[k]; }
      demo.life = /[?&]life(?:&|#|$)/.test(location.search);
      enqueueHero([demo]);
    }, 1500);
  }
  function refreshCounts(b) {
    var els = stage.querySelectorAll('.bird'), k = VIEW === 'hour' ? hourCount(b) : b.n;
    for (var i = 0; i < els.length; i++) {
      if (els[i].getAttribute('data-name') === b.name) {
        els[i].setAttribute('aria-label', b.name + ', heard ' + timesWord(k));
        var c = els[i].querySelector('.cap > span');
        if (c && !b.ph) { c.textContent = 'heard ' + timesWord(k); }
      }
    }
  }
  /* The board's own code changed (a new layout was published): load it. Waits
     until nobody is touching the screen, and tries at most once every two
     minutes per version so a stale cached copy can never cause a reload loop. */
  /* A newer board is on the PC. Reload to get it, at a quiet moment. While
     Spotify is playing a reload would stop the music, so the screen shows an
     "Update ready" button instead and waits for a tap. With only the voice on,
     it reloads, and the new page keeps the voice on where the browser allows a
     page that was allowed to play sound to keep doing so after reloading. */
  var nvBtn = $('nv');
  nvBtn.addEventListener('click', function () { keepVoice(); location.reload(); });
  function keepVoice() { try { if (voiceOn && voiceReady) { sessionStorage.setItem('bb-voice-was', '1'); } } catch (e) {} }
  function newCodeReload(code) {
    if (modal.classList.contains('open') || heroOn() || Date.now() - lastTouch < 20000) { return false; }
    if (musicLoaded && Date.now() - musicSince < 43200000) { nvBtn.hidden = false; return false; }
    keepVoice();
    try {
      var last = JSON.parse(sessionStorage.getItem('bb-code') || 'null');
      if (last && last.c === code && Date.now() - last.t < 120000) { return false; }
      sessionStorage.setItem('bb-code', JSON.stringify({ c: code, t: Date.now() }));
    } catch (e) { /* storage blocked: still reload, once per page load */
      if (codeTried === code) { return false; }
      codeTried = code;
    }
    location.reload();
    return true;
  }
  var codeTried = '', dateTried = '';
  /* The day changed. Reload to get the new day's page, but only once per day change
     (per ten minutes): an old saved copy that reloads into itself would otherwise
     reload forever. If the reload did not help, apply() rolls the day over in place. */
  function dateReload(date) {
    if (musicHold()) { return false; }                 /* roll the day over in place instead */
    try {
      var last = JSON.parse(sessionStorage.getItem('bb-date') || 'null');
      if (last && last.d === date && Date.now() - last.t < 600000) { return false; }
      sessionStorage.setItem('bb-date', JSON.stringify({ d: date, t: Date.now() }));
    } catch (e) {
      if (dateTried === date) { return false; }
      dateTried = date;
    }
    location.reload();
    return true;
  }
  function apply(P) {
    liveOK = true;
    var rolled = false;
    if (P.date !== D.date) {
      if (dateReload(P.date)) { return; }
      D.date = P.date; $('date').textContent = P.date; rolled = true;
      seenKey = 'bb-seen-' + D.date; seen = {};
      try { var rs = localStorage.getItem(seenKey); if (rs) { seen = JSON.parse(rs) || {}; } } catch (e) {}
    }
    if (P.code && D.code && P.code !== D.code && newCodeReload(P.code)) { return; }
    if (modal.classList.contains('open') && !rolled) { return; }
    var byName = {}, now = Date.now() / 1000, announce = [], redraw = false, fresh = [];
    D.birds.forEach(function (b) { if (!rolled) { byName[b.name] = b; } });
    var next = P.birds.map(function (nb) {
      var old = byName[nb.name];
      if (old && !!old.ph === !!nb.ph) {
        if (old.n !== nb.n) {
          if (nb.n > old.n) { heardAgain(nb.name); }
          old.n = nb.n; old.count = 'heard ' + timesWord(nb.n);
          old.last = nb.last; old.mins = nb.mins; refreshCounts(old);
        }
        return old;
      }
      nb.count = 'heard ' + timesWord(nb.n);
      nb.img = absImg(nb.img);
      redraw = true; fresh.push(nb);
      if (old) { arriveSet[nb.name] = 1; }              /* its picture just arrived */
      else if (!seen[nb.name] && nb.ts > now - 600) { announce.push(nb); if (heroOff) { arriveSet[nb.name] = 1; } }
      seen[nb.name] = 1;
      return nb;
    });
    if (next.length !== D.birds.length || rolled) { redraw = true; }
    D.updated = P.updated; D.sun = P.sun;
    if (VIEW === 'hour' && !redraw) {
      /* This hour: a bird heard earlier today but not yet this hour lands now. */
      hourBirds().forEach(function (b) { if (!HOUR_SHOWN[b.name]) { arriveSet[b.name] = 1; redraw = true; } });
    }
    if (P.listen) { takeListen(P.listen); }
    if (!redraw) { header(); return; }
    var todo = fresh.filter(function (b) { return !b.ph && b.img; }), left = todo.length, done = false;
    function go() {
      if (done) { return; }
      done = true;
      D.birds = next; header(); saveSeen(); setTimeout(singing, 0);
      build();
      stage.classList.remove('swap'); void stage.offsetWidth; stage.classList.add('swap');
      for (var k = 0; k < pages.length; k++) { if (pages[k].querySelector('.arrive')) { show(k); break; } }
      if (heroOff) { showBanner(announce); } else { enqueueHero(announce); }
      setTimeout(function () {
        arriveSet = {};
        var els = stage.querySelectorAll('.arrive');
        for (var i = 0; i < els.length; i++) { els[i].classList.remove('arrive'); }
      }, 14000);
    }
    if (!left) { go(); return; }
    todo.forEach(function (b) {
      var im = new Image();
      im.onload = im.onerror = function () { if (--left === 0) { go(); } };
      im.src = b.img;
    });
    setTimeout(go, 4000);
  }
  function poll() {
    if (document.hidden || Date.now() < liveOff) { return; }
    fetch(LIVE_URL, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) { throw new Error('http ' + r.status); } return r.json(); })
      .then(function (P) { liveFails = 0; apply(P); })
      .catch(function () {
        if (liveOK) { liveOK = false; header(); }
        if (++liveFails >= 3) { liveOff = Date.now() + 600000; liveFails = 0; }
      });
  }
  if (window.fetch) {
    setInterval(poll, 8000);
    setTimeout(poll, 1500);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { poll(); } });
  }
  /* Without live updates, reload every few minutes while nobody is touching it;
     with them, only now and then so the page itself stays fresh. */
  setInterval(function () {
    var limit = liveOK ? 3600000 : 300000;
    if (!modal.classList.contains('open') && !heroOn() && !musicHold() && Date.now() - lastTouch > 90000 &&
        Date.now() - loadedAt > limit) { location.reload(); }
  }, 60000);
})();
</script>
